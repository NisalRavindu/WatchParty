name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t watchparty .
      - name: Smoke test
        run: |
          docker run -d --name watchparty -p 8000:8000 watchparty
          for attempt in $(seq 1 20); do
            curl -fs http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/ | grep -q WatchParty
      - name: Container logs
        if: failure()
        run: docker logs watchparty
